name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build .3dsx + .cia
        run: ./build.sh cia

      - uses: actions/upload-artifact@v4
        with:
          name: sharkive-updater
          path: |
            sharkive-updater.3dsx
            sharkive-updater.cia

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" sharkive-updater.3dsx sharkive-updater.cia --generate-notes
